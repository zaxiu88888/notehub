spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/notehub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # username / password 在 application-local.yaml 中配置(不入库)
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000

logging:
  level:
    com.notehub: debug
