# =====================================================================
# 本地敏感配置模板 —— 使用方法:
#   cp application-local-template.yaml application-local.yaml
#   然后填入真实值。application-local.yaml 已被 .gitignore 排除, 不入库。
# =====================================================================

spring:
  datasource:
    username: root
    password: "你的MySQL密码"

# JWT 签名密钥: 随机字符串, 长度必须 >= 32 字节 (示例可用命令生成:
#   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
jwt:
  secret: "请替换为随机生成的>=32字节密钥字符串"

# QQ 邮箱 SMTP (在 mail.verify-code.enabled=true 时生效)
# 授权码获取: QQ邮箱 -> 设置 -> 账户 -> 开启SMTP服务 -> 生成授权码
spring.mail:
  host: smtp.qq.com
  port: 465
  username: 你的QQ邮箱@qq.com
  password: 你的SMTP授权码
  properties:
    mail.smtp.auth: true
    mail.smtp.ssl.enable: true
  protocol: smtps
  default-encoding: UTF-8

mail:
  verify-code:
    enabled: true         # true=真发邮件; 本地无授权码时保持 false(验证码写日志)
